services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: simple_invoicing_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI Service (production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simple_invoicing_backend
    profiles: ["prod"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-simple_user}:${POSTGRES_PASSWORD:-simple_password}@db:5432/${POSTGRES_DB:-simple_invoicing}}
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env.production
        required: false
    depends_on:
      db:
        condition: service_healthy
        required: false
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI Service (development)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: simple_invoicing_backend_dev
    profiles: ["dev"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file: ./backend/.env.development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  # Frontend React Service (production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simple_invoicing_frontend
    profiles: ["prod"]
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend React Service (development)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: simple_invoicing_frontend_dev
    profiles: ["dev"]
    environment:
      API_PROXY_TARGET: http://backend-dev:8000
    depends_on:
      - backend-dev
    ports:
      - "${FRONTEND_DEV_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:

networks:
  default:
    name: simple_invoicing_network
